<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T&C Guardian Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 440px;
      max-height: 580px;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      font-size: 20px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 4px 8px;
      border-radius: 8px;
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .current-site-pill {
      font-size: 11px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 4px 8px;
      border-radius: 6px;
      color: #38bdf8;
      font-family: monospace;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Content Area */
    main {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    main::-webkit-scrollbar {
      width: 6px;
    }
    main::-webkit-scrollbar-track {
      background: var(--bg);
    }
    main::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 3px;
    }

    /* Section Headers */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Global Preferences Cards */
    .profile-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .profile-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .profile-cat-name {
      font-weight: 600;
      font-size: 13px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge-dealbreaker {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .badge-assumed-yes {
      background: rgba(16, 185, 129, 0.2);
      color: #86efac;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .badge-neutral {
      background: rgba(148, 163, 184, 0.15);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .ratio-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ratio-bar {
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
      display: flex;
    }

    .ratio-yes {
      background: var(--success);
      height: 100%;
      transition: width 0.3s ease;
    }

    .ratio-no {
      background: var(--danger);
      height: 100%;
      transition: width 0.3s ease;
    }

    .ratio-stats {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-yes {
      color: #86efac;
    }

    .stat-no {
      color: #fca5a5;
    }

    /* Site Overrides Section */
    .search-input-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px 8px 32px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .overrides-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .override-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .override-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .override-domain {
      font-weight: 600;
      font-size: 13px;
      color: #ffffff;
      font-family: monospace;
    }

    .btn-delete-domain {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .btn-delete-domain:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .override-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .override-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    .override-tag:hover {
      transform: translateY(-1px);
      filter: brightness(1.15);
    }

    .tag-yes {
      background: #064e3b;
      color: #86efac;
      border: 1px solid #059669;
    }

    .tag-no {
      background: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #dc2626;
    }

    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-muted);
      font-size: 12px;
      background: rgba(30, 41, 59, 0.4);
      border: 1px dashed var(--card-border);
      border-radius: 8px;
    }

    /* Footer */
    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .btn-reset-all {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-reset-all:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .app-version {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand-title">
      <div class="brand-logo">🛡️</div>
      <div class="brand-text">
        <h1>T&C Guardian</h1>
        <p>Privacy & Preferences Hub</p>
      </div>
    </div>
    <div class="current-site-pill" id="currentSitePill" title="Active Tab Domain">...</div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Global User Profile Learning Summary -->
    <section>
      <div class="section-header">
        <span class="section-title">🧠 Learned Tendencies</span>
        <span style="font-size: 11px; color: var(--text-muted);">Accepted vs Rejected</span>
      </div>
      <div class="profile-grid" id="profileGrid">
        <!-- Rendered by popup.js -->
      </div>
    </section>

    <!-- Searchable Site Overrides -->
    <section>
      <div class="section-header">
        <span class="section-title">🌐 Site Overrides</span>
        <span style="font-size: 11px; color: var(--text-muted);" id="overridesCount">0 domains</span>
      </div>

      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="domainSearch" class="search-input" placeholder="Search domain overrides...">
      </div>

      <div class="overrides-list" id="overridesList">
        <!-- Rendered by popup.js -->
      </div>
    </section>
  </main>

  <!-- Footer Actions -->
  <footer>
    <button class="btn-reset-all" id="btnResetAll">
      <span>↺</span>
      <span>Reset All Learned Preferences</span>
    </button>
    <span class="app-version">v1.0.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>

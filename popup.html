<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T&C Guardian</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    :root {
      --badge-high: #ef4444;
      --badge-medium: #f59e0b;
      --badge-low: #10b981;
    }

    /* Strictly enforce distinct pastel background and border colors on risk cards */
    .risk-card.high {
      background-color: #fef2f2 !important;
      border-color: #fecaca !important;
      border-left: 5px solid var(--badge-high, #ef4444) !important;
    }

    .risk-card.medium {
      background-color: #fffbeb !important;
      border-color: #fde68a !important;
      border-left: 5px solid var(--badge-medium, #f59e0b) !important;
    }

    .risk-card.low {
      background-color: #f0fdf4 !important;
      border-color: #bbf7d0 !important;
      border-left: 5px solid var(--badge-low, #10b981) !important;
    }
  </style>
</head>
<body class="theme-neutral">
  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-container">
      <img id="brandShieldIcon" class="brand-icon-shield" src="icons/guardian-neutral.png" alt="T&C Guardian">
      <span class="brand-name">T&C Guardian</span>
    </div>
    <div class="header-actions">
      <button id="btnToggleSettings" class="btn-icon-nav" title="Toggle Preferences & History">⚙️</button>
    </div>
  </header>

  <!-- Segmented View Tabs Navigation -->
  <nav class="view-tabs-bar" aria-label="View Navigation">
    <button id="tabBtnWebsite" class="view-tab-btn active" data-view="website">
      <span>🌐</span>
      <span>This Website</span>
    </button>
    <button id="tabBtnPreferences" class="view-tab-btn" data-view="preferences">
      <span>⚙️</span>
      <span>Preferences</span>
    </button>
  </nav>

  <!-- PRIMARY VIEW: THIS WEBSITE -->
  <main id="viewThisWebsite" class="view-panel active">
    <!-- Hero Mascot & Status Section -->
    <section class="hero-status-section" id="heroStatusSection">
      <img id="heroMascotImg" class="hero-mascot-img" src="icons/guardian-neutral.png" alt="Guardian Mascot">
      <div class="hero-info">
        <span class="hero-pill-badge" id="heroPillBadge">Checking policies...</span>
        <h2 class="hero-headline" id="heroHeadline">Checking policies...</h2>
        <p class="hero-subtext" id="heroSubtext">Checking terms and privacy policies on this page.</p>
      </div>
    </section>

    <!-- Findings Container -->
    <section class="findings-container" id="findingsContainer">
      <!-- Dynamically populated by popup.js: Clean Card, Finding Cards, Cancellation Guide, or Unanalyzed Card -->
    </section>
  </main>

  <!-- SECONDARY VIEW: PREFERENCES & HISTORICAL CHOICES -->
  <section id="viewPreferences" class="view-panel">
    <div class="preferences-container">
      <!-- Historical Choices -->
      <div>
        <div class="pref-section-title">
          <span>📊 Historical Choices</span>
          <span style="font-size: 10px; font-weight: normal; color: var(--text-sub);">Explicit votes</span>
        </div>
        <div class="profile-grid-wrap" id="profileGrid">
          <!-- Rendered by popup.js -->
        </div>
      </div>

      <!-- Searchable Site Overrides -->
      <div>
        <div class="pref-section-title">
          <span>🌐 Site Overrides</span>
          <span id="overridesCount" style="font-size: 10.5px; font-weight: 600; color: #3b82f6;">0 domains</span>
        </div>
        <div class="search-box-wrap">
          <input type="text" id="domainSearch" class="search-input" placeholder="Search domain overrides...">
        </div>
        <div class="overrides-list" id="overridesList">
          <!-- Rendered by popup.js -->
        </div>
      </div>

      <!-- Reset Controls -->
      <div class="reset-section">
        <div class="reset-desc">Clear learned votes & overrides</div>
        <button class="btn-reset-all" id="btnResetAll" title="Reset all learned preferences">
          ↺ Reset All
        </button>
      </div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
